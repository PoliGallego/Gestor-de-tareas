# Puerto único para el microservicio de reportes
server.port=8083

spring.application.name=microservicio-reportes

# Conexión a tu base de datos en Supabase (puedes usar la misma instancia 
# o una base de datos/schema separado si prefieres mantener los datos aislados)
spring.datasource.url=${DB_URL:jdbc:postgresql://db.mvtdklxcdxfgrwqhbdwz.supabase.co:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:supabase123$}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

auth.host=http://${AUTH_BACK_HOST:localhost}:
auth.port=${AUTH_BACK_PORT:8090}